name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git zip unzip openjdk-17-jdk \
          python3-pip autoconf libtool \
          pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev \
          libtinfo6 cmake libffi-dev \
          libssl-dev automake

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade Cython==0.29.33
        pip install --upgrade buildozer==1.5.0

    - name: Cache buildozer global
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}

    - name: Cache buildozer local
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-local-${{ hashFiles('buildozer.spec') }}

    - name: Build APK
      run: |
        export ANDROIDAPI="31"
        export ANDROIDMINAPI="21"
        buildozer android debug

    - name: Show APK location
      if: always()
      run: |
        find . -name "*.apk" -type f
        ls -la bin/ 2>/dev/null || echo "No bin directory"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: nepse-tracker-apk
        path: bin/*.apk
        if-no-files-found: warn
