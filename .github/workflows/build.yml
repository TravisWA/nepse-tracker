name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          git zip unzip \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev \
          libltdl-dev automake

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade wheel setuptools
        pip install --upgrade Cython==0.29.36
        pip install --upgrade buildozer==1.5.0
        pip install --upgrade virtualenv

    - name: Cache buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-v3-${{ hashFiles('buildozer.spec') }}

    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tee build_output.log

    - name: Check APK
      run: |
        if ls bin/*.apk 1> /dev/null 2>&1; then
          echo "✅ SUCCESS!"
          ls -la bin/
        else
          echo "❌ FAILED - Last 200 lines:"
          tail -200 build_output.log
          exit 1
        fi

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: NEPSE-Tracker-APK
        path: bin/*.apk

    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: full-build-log
        path: build_output.log
