name: Build NEPSE APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

    - name: Get code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install tools
      run: |
        pip install buildozer cython
        sudo apt-get update -qq
        sudo apt-get install -y \
          git zip unzip \
          openjdk-17-jdk \
          python3-pip \
          autoconf libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 cmake \
          libffi-dev libssl-dev

    - name: Build APK
      run: |
        yes | buildozer android debug 2>&1 \
          | tail -20

    - name: Save APK
      uses: actions/upload-artifact@v3
      with:
        name: NEPSE-Tracker-APK
        path: bin/*.apk
        retention-days: 90
