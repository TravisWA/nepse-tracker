name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for Android
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          git zip unzip \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses-dev \
          cmake libffi-dev libssl-dev \
          libltdl-dev automake

    - name: Install Python packages
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade wheel
        pip install --upgrade Cython==0.29.36
        pip install --upgrade buildozer==1.5.0
        pip install --upgrade virtualenv

    - name: Cache buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Build APK
      run: |
        buildozer android debug 2>&1 | tee build_output.log
        echo "===== END OF BUILD ====="
        echo "Contents of bin folder:"
        ls -la bin/ 2>/dev/null || echo "bin folder does not exist!"

    - name: Show last 200 lines if build failed
      if: failure()
      run: |
        echo "===== LAST 200 LINES OF BUILD LOG ====="
        tail -200 build_output.log

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: NEPSE-Tracker-APK
        path: bin/*.apk
        if-no-files-found: error

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_output.log
        retention-days: 30
